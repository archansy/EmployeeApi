services:
  employee-service:
    build:
      context: .
      dockerfile: src/EmployeeService.Api/Dockerfile
    image: employee-service:local
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EMPLOYEE_SERVICE__CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      EMPLOYEE_SERVICE__JWT_SIGNING_KEY: ${EMPLOYEE_SERVICE__JWT_SIGNING_KEY}
      Cors__AllowedOrigin: ${FRONTEND_ORIGIN}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
