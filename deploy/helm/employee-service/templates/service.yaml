apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-service.fullname" . }}
  labels:
    app: {{ include "employee-service.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "employee-service.name" . }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
