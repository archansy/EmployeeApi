replicaCount: 2

image:
  repository: your-registry/employee-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  aspnetcoreEnvironment: Production

secret:
  connectionString: "<set-at-deploy-time>"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  livenessPath: /health/live
  readinessPath: /health/ready

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCpuUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1
